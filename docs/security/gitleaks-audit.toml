title = "Bibleit publication audit: default rules plus service credentials"

[extend]
useDefault = true

[[rules]]
id = "bibleit-bearer-token"
description = "Bibleit bt_ token with the server's 43-character Base62 payload"
regex = '''\bbt_[0-9A-Za-z]{43}\b'''
keywords = ["bt_"]

[[rules]]
id = "bibleit-browser-code"
description = "Bibleit CLI authorization code or approval-flow identifier"
regex = '''\bb(?:cc|cf)_[0-9A-Za-z_-]{43}\b'''
keywords = ["bcc_", "bcf_"]

[[rules]]
id = "credential-url-review"
description = "URL user/password pair requiring fixture or credential classification"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*://[^\s/"'<>:@]+:([^\s/@"'<>]+)@'''
secretGroup = 1

[[rules]]
id = "sensitive-url-query-review"
description = "Long credential in URL query requiring manual classification"
regex = '''(?i)[?&](?:access_token|refresh_token|token|code|secret|password)=([0-9a-z_%+./=-]{20,})'''
secretGroup = 1

name: Validate public installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved published CLI version (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      EXPECTED_INSTALLER_RUNNER: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Require a public repository
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: test "$PRIVATE_REPOSITORY" = false
      - name: Require native Windows ARM64
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'Arm64') { throw 'ARM64 operating system required' }
          python -c "import platform; assert platform.machine().lower() in ('arm64', 'aarch64')"
      - name: Anonymous latest and explicit release installation
        shell: bash
        run: python scripts/check_public_installers.py --version "$VERSION"
      - name: Save public validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-installers-${{ matrix.os }}
          path: build/validation/public-installers.json
          if-no-files-found: ignore

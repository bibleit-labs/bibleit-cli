name: Generate draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag on main
        shell: bash
        run: git merge-base --is-ancestor HEAD origin/main
  test:
    needs: source
    uses: ./.github/workflows/native.yml
  assets:
    needs: [source, test]
    uses: ./.github/workflows/release-candidate.yml
    with:
      version: ${{ github.ref_name }}
  draft:
    needs: [test, assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-assets
          path: assets
          digest-mismatch: error
      - name: Create draft with validated assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$VERSION" assets/* --verify-tag --draft \
            --title "$VERSION" --notes-file CHANGELOG.md

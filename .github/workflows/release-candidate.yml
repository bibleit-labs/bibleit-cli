# Private draft validation is authorized. No tags or releases are published.
name: Validate release candidate
on:
  push:
    branches: [package-manager-validation, integration-refresh]
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (vMAJOR.MINOR.PATCH, optional prerelease)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    name: Build six-target candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CANDIDATE_VERSION: ${{ inputs.version || 'v0.1.0-ci.1' }}
    steps:
      - uses: actions/checkout@v6
      - name: Check out exact private Go client
        uses: actions/checkout@v6
        with:
          repository: bibleit-labs/bibleit-go
          ref: 59dfaa45836002dc6c159a07407c08e382763b7c
          path: .ci-client
          token: ${{ secrets.BIBLEIT_CLIENT_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare draft client workspace
        run: go work init . ./.ci-client
      - name: Package development candidate (never a production release)
        run: python scripts/package_release.py --local --version "$CANDIDATE_VERSION"
      - name: Save immutable candidate inputs
        uses: actions/upload-artifact@v7
        with:
          name: candidate-assets
          path: build/releases/
          if-no-files-found: error

  candidate:
    name: Native installers ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned Scoop engine
        if: runner.os == 'Windows'
        uses: actions/checkout@v6
        with:
          repository: ScoopInstaller/Scoop
          ref: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f
          path: .ci-scoop
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download exact candidate inputs from this run
        uses: actions/download-artifact@v8
        with:
          name: candidate-assets
          path: build/releases
          digest-mismatch: error
      - name: Offline native installer checks
        run: python scripts/check_release.py --assets build/releases
      - name: Windows PowerShell 5.1 installation and replacement
        if: runner.os == 'Windows'
        run: python scripts/check_release.py --assets build/releases --powershell powershell
      - name: PowerShell parser and failure paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check_powershell_installer.ps1 -AssetsDir build/releases
      - name: Native Scoop installation lifecycle
        if: runner.os == 'Windows'
        run: python scripts/check_scoop.py --assets build/releases --scoop-source .ci-scoop
      - name: Native Homebrew installation lifecycle
        if: runner.os == 'macOS'
        run: python scripts/check_homebrew.py --assets build/releases
      - name: Save native validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.os }}
          path: build/validation/
          if-no-files-found: ignore

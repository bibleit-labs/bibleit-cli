# Builds and validates standalone assets; publication belongs to release.yml.
name: Validate release candidate
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (vMAJOR.MINOR.PATCH, optional prerelease)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    name: Build six-target candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      CANDIDATE_VERSION: ${{ inputs.version || 'v0.1.0-ci.1' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download and verify public SDK
        run: |
          go mod download
          go mod verify
      - name: Package standalone candidate
        run: python scripts/package_release.py --version "$CANDIDATE_VERSION"
      - name: Save immutable candidate inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-assets
          path: build/releases/
          if-no-files-found: error

  candidate:
    name: Native installers ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXPECTED_INSTALLER_RUNNER: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out pinned Scoop engine
        if: runner.os == 'Windows'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ScoopInstaller/Scoop
          ref: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f
          path: .ci-scoop
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Require native Windows ARM64 execution
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'Arm64') {
            throw 'Windows ARM64 validation requires an ARM64 operating system'
          }
          python -c "import platform; assert platform.machine().lower() in ('arm64', 'aarch64'), platform.machine()"
      - name: Download exact candidate inputs from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-assets
          path: build/releases
          digest-mismatch: error
      - name: Offline native installer checks
        run: python scripts/check_release.py --assets build/releases
      - name: Windows PowerShell 5.1 installation and replacement
        if: runner.os == 'Windows'
        run: python scripts/check_release.py --assets build/releases --powershell powershell
      - name: PowerShell parser and failure paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check_powershell_installer.ps1 -AssetsDir build/releases
      - name: Native Scoop installation lifecycle
        if: runner.os == 'Windows'
        run: python scripts/check_scoop.py --assets build/releases --scoop-source .ci-scoop
      - name: Native Homebrew installation lifecycle
        if: runner.os == 'macOS'
        run: python scripts/check_homebrew.py --assets build/releases
      - name: Save native validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-${{ matrix.os }}
          path: build/validation/
          if-no-files-found: ignore
